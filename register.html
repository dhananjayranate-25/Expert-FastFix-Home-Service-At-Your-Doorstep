<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FastFix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
            50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
        .glow-animation { animation: pulse-glow 2s ease-in-out infinite; }
        .register-card { animation: slideIn 0.8s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-['Roboto'] bg-gradient-to-br from-green-50 via-blue-50 to-green-100 min-h-screen flex items-center justify-center p-4 overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <div class="absolute top-20 left-20 w-32 h-32 border-2 border-green-300 rounded-full"></div>
        <div class="absolute top-40 right-32 w-24 h-24 border-2 border-blue-400 rounded-full"></div>
        <div class="absolute bottom-32 left-40 w-20 h-20 border-2 border-green-500 rounded-full"></div>
        <div class="absolute bottom-20 right-20 w-16 h-16 border-2 border-blue-600 rounded-full"></div>
    </div>

    <div class="register-card bg-white/95 backdrop-blur-lg p-10 rounded-3xl shadow-2xl w-full max-w-lg border border-green-100/50 relative overflow-hidden">
        <!-- Animated Background Elements -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-gradient-to-br from-green-200 to-blue-300 rounded-full opacity-20 float-animation"></div>
        <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-gradient-to-tr from-blue-300 to-green-400 rounded-full opacity-15 float-animation" style="animation-delay: 1s;"></div>

        <!-- Logo/Brand Section -->
        <div class="text-center mb-10 relative z-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-green-500 to-blue-600 rounded-full mb-6 shadow-xl glow-animation">
                <i class="fas fa-user-plus text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-['Playfair_Display'] font-bold text-gray-800 mb-3 tracking-wide">Join FastFix</h1>
            <p class="text-gray-600 text-lg">Create your account and get started</p>
            <div class="mt-4 flex justify-center space-x-2">
                <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                <div class="w-2 h-2 bg-green-600 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
            </div>
        </div>

        <!-- Success Message Container -->
        <div id="success-message" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-sm font-medium">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="success-text">Registration successful! Redirecting to login...</span>
        </div>

        <form id="register-form" class="space-y-5 relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative group">
                    <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-green-400 group-focus-within:text-green-600 transition-colors"></i>
                    <input type="text" placeholder="Full Name" required
                           class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-400 transition-all duration-300 bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400 shadow-sm">
                </div>

                <div class="relative group">
                    <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-green-400 group-focus-within:text-green-600 transition-colors"></i>
                    <input type="email" placeholder="Email Address" required
                           class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-400 transition-all duration-300 bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400 shadow-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative group">
                    <i class="fas fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-green-400 group-focus-within:text-green-600 transition-colors"></i>
                    <input type="tel" placeholder="Mobile Number" required
                           class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-400 transition-all duration-300 bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400 shadow-sm">
                </div>

                <div class="relative group">
                    <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-green-400 group-focus-within:text-green-600 transition-colors"></i>
                    <input type="password" placeholder="Password" required
                           class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-400 transition-all duration-300 bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400 shadow-sm">
                </div>
            </div>

            <div class="relative group">
                <i class="fas fa-map-marker-alt absolute left-4 top-4 text-green-400 group-focus-within:text-green-600 transition-colors"></i>
                <textarea placeholder="Complete Address" required rows="3"
                          class="w-full pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-green-100 focus:border-green-400 transition-all duration-300 bg-gray-50 focus:bg-white text-gray-700 placeholder-gray-400 shadow-sm resize-none"></textarea>
            </div>

            <div class="flex items-start">
                <input type="checkbox" required class="mt-1 rounded border-2 border-gray-300 text-green-600 focus:ring-green-500 focus:ring-2 w-4 h-4">
                <span class="ml-3 text-sm text-gray-600 leading-relaxed">
                    I agree to the <a href="#" class="text-green-600 hover:text-green-800 font-semibold underline">Terms of Service</a>
                    and <a href="#" class="text-green-600 hover:text-green-800 font-semibold underline">Privacy Policy</a>
                </span>
            </div>

            <button type="submit" id="register-btn"
                    class="w-full bg-gradient-to-r from-green-500 via-green-600 to-blue-600 hover:from-green-600 hover:via-green-700 hover:to-blue-700 text-white py-4 rounded-2xl transition-all duration-300 shadow-xl hover:shadow-2xl transform hover:-translate-y-1 font-bold text-lg relative overflow-hidden group">
                <span class="relative z-10 flex items-center justify-center">
                    <i class="fas fa-user-plus mr-3"></i>
                    <span id="btn-text">Create Account</span>
                    <i class="fas fa-arrow-right ml-3 transform group-hover:translate-x-1 transition-transform"></i>
                </span>
                <div class="absolute inset-0 bg-gradient-to-r from-green-400 to-blue-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
            </button>
        </form>

        <div class="mt-10 text-center relative z-10">
            <p class="text-gray-500 text-sm">Already have an account?
                <a href="login.html" class="text-green-600 hover:text-blue-800 font-semibold ml-1 transition-colors duration-200 hover:underline">Sign in here</a>
            </p>
        </div>

        <!-- Trust Badge -->
        <div class="mt-6 flex justify-center">
            <div class="flex items-center bg-blue-50 px-4 py-2 rounded-full border border-blue-200">
                <i class="fas fa-shield-alt text-blue-600 mr-2"></i>
                <span class="text-blue-700 text-xs font-semibold">Secure Registration</span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const successMessage = document.getElementById('success-message');
        const registerBtn = document.getElementById('register-btn');
        const btnText = document.getElementById('btn-text');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Show loading state
            registerBtn.disabled = true;
            btnText.textContent = 'Creating Account...';
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-3"></i><span id="btn-text">Creating Account...</span>';

            const name = this.querySelector('input[type="text"]').value;
            const email = this.querySelector('input[type="email"]').value;
            const mobile = this.querySelector('input[type="tel"]').value;
            const address = this.querySelector('textarea').value;
            const password = this.querySelector('input[type="password"]').value;

            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, mobile, address, password, role: 'user' })
                });

                if (response.ok) {
                    // Success animation
                    registerBtn.innerHTML = '<i class="fas fa-check mr-3"></i><span id="btn-text">Success!</span>';
                    registerBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                    registerBtn.classList.remove('bg-gradient-to-r', 'from-green-500', 'via-green-600', 'to-blue-600', 'hover:from-green-600', 'hover:via-green-700', 'hover:to-blue-700');

                    // Show success message
                    successMessage.classList.remove('hidden');
                    successMessage.classList.add('animate-pulse');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const errorData = await response.json();
                    alert(errorData.error || 'Registration failed');
                    // Reset button
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus mr-3"></i><span id="btn-text">Create Account</span><i class="fas fa-arrow-right ml-3 transform group-hover:translate-x-1 transition-transform"></i>';
                }
            } catch (err) {
                console.error(err);
                alert('Server error.');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus mr-3"></i><span id="btn-text">Create Account</span><i class="fas fa-arrow-right ml-3 transform group-hover:translate-x-1 transition-transform"></i>';
            }
        });

        // Add input focus effects
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('ring-2', 'ring-green-200');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('ring-2', 'ring-green-200');
            });
        });
    </script>
</body>
</html>
