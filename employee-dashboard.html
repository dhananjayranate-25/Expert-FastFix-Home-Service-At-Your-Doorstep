<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - FastFix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="sidebar w-64 text-white p-6 fixed h-full">
            <div class="flex items-center mb-8">
                <i class="fas fa-user-tie text-yellow-300 text-2xl mr-3"></i>
                <h1 class="text-2xl font-bold">FastFix</h1>
            </div>
            <nav class="space-y-4">
                <a href="#mywork" class="nav-link flex items-center p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-tasks mr-3"></i> My Work
                </a>
                <a href="#completed" class="nav-link flex items-center p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-check-circle mr-3"></i> Completed
                </a>
                <a href="#profile" class="nav-link flex items-center p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-user mr-3"></i> My Profile
                </a>
                <a href="#changepassword" class="nav-link flex items-center p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-key mr-3"></i> Change Password
                </a>
            </nav>
            <div class="absolute bottom-6 left-6">
                <button onclick="logout()" class="flex items-center p-3 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                    <i class="fas fa-sign-out-alt mr-3"></i> Logout
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 ml-64 p-8">
            <!-- Header -->
            <header class="mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Welcome, <span id="employee-name">Employee</span></h2>
                <p class="text-gray-600 mt-2">Service: <span id="employee-service" class="font-semibold text-green-600"></span></p>
            </header>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="stats-cards">
                <!-- Stats will be loaded here -->
            </div>

            <!-- Content Sections -->
            <div id="content-sections">
                <!-- My Work -->
                <section id="mywork-section" class="mb-8">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-semibold mb-4 flex items-center">
                            <i class="fas fa-tasks text-green-600 mr-2"></i> My Assigned Work
                        </h3>
                        <div class="space-y-4" id="mywork-list">
                            <!-- Work will be loaded here -->
                        </div>
                    </div>
                </section>

                <!-- Completed -->
                <section id="completed-section" class="mb-8 hidden">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-semibold mb-4 flex items-center">
                            <i class="fas fa-check-circle text-blue-600 mr-2"></i> Completed Jobs
                        </h3>
                        <div class="space-y-4" id="completed-list">
                            <!-- Completed work will be loaded here -->
                        </div>
                    </div>
                </section>

                <!-- Profile -->
                <section id="profile-section" class="mb-8 hidden">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-semibold mb-4 flex items-center">
                            <i class="fas fa-user text-purple-600 mr-2"></i> My Profile
                        </h3>
                        <form id="profile-form" class="max-w-md">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                <input type="text" id="profile-name" required 
                                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" id="profile-email" disabled 
                                       class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Service</label>
                                <input type="text" id="profile-service" disabled 
                                       class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100">
                            </div>
                            <button type="submit" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white px-6 py-2 rounded-lg font-semibold transition">
                                Update Profile
                            </button>
                        </form>
                    </div>
                </section>

                <!-- Change Password -->
                <section id="changepassword-section" class="mb-8 hidden">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-xl font-semibold mb-4 flex items-center">
                            <i class="fas fa-key text-red-600 mr-2"></i> Change Password
                        </h3>
                        <form id="change-password-form" class="max-w-md">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
                                <input type="password" id="current-password" required placeholder="Enter current password"
                                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                                <input type="password" id="new-password" required placeholder="Enter new password"
                                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
                                <input type="password" id="confirm-password" required placeholder="Confirm new password"
                                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <button type="submit" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-6 py-2 rounded-lg font-semibold transition">
                                Update Password
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="employee-script.js"></script>
</body>
</html>
