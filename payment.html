<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - FastFix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .payment-card { transition: all 0.3s ease; }
        .payment-card.active { border-color: #3b82f6; background-color: #eff6ff; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        <!-- Order Summary (Left) -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-800 text-white p-8 md:w-1/3 flex flex-col justify-between relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-8 -mt-8 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
            
            <div class="relative z-10">
                <a href="index.html" class="flex items-center space-x-2 text-white/80 hover:text-white transition mb-12">
                    <i class="fas fa-arrow-left"></i>
                    <span>Cancel Payment</span>
                </a>
                
                <h2 class="text-2xl font-bold mb-6">Order Summary</h2>
                
                <div class="space-y-4">
                    <div>
                        <p class="text-white/70 text-sm">Service</p>
                        <p class="font-semibold text-lg" id="summary-service">Loading...</p>
                    </div>
                    <div>
                        <p class="text-white/70 text-sm">Customer</p>
                        <p class="font-semibold" id="summary-name">Loading...</p>
                    </div>
                    <div>
                        <p class="text-white/70 text-sm">Date Scheduled</p>
                        <p class="font-semibold" id="summary-date">Loading...</p>
                    </div>
                </div>
            </div>

            <div class="mt-8 border-t border-white/20 pt-6 relative z-10">
                <div class="mb-4">
                    <label class="block text-sm text-white/80 mb-2">Have a Promo Code?</label>
                    <div class="flex gap-2">
                        <input type="text" id="promo-input" placeholder="Enter code" class="w-full px-3 py-2 rounded text-gray-900 focus:outline-none uppercase">
                        <button type="button" onclick="applyPromo()" class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded text-white font-semibold transition">Apply</button>
                    </div>
                    <p id="promo-message" class="text-xs mt-2 hidden"></p>
                </div>
                <div class="flex justify-between items-end">
                    <span class="text-white/80">Total Amount</span>
                    <span class="text-3xl font-bold" id="total-amount-display">₹499</span>
                </div>
                <p class="text-xs text-white/60 mt-2"><i class="fas fa-shield-alt mr-1"></i> Secured by FastFix SecurePay</p>
            </div>
        </div>

        <!-- Payment Methods (Right) -->
        <div class="p-8 md:w-2/3 bg-white relative">
            
            <!-- Loading Overlay -->
            <div id="processing-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-50 hidden flex-col items-center justify-center rounded-r-2xl">
                <div class="loader mb-4" style="width: 48px; height: 48px; border-width: 4px;"></div>
                <h3 class="text-xl font-semibold text-gray-800">Processing Payment...</h3>
                <p class="text-gray-500 mt-2">Please do not close this window</p>
            </div>

            <h2 class="text-2xl font-bold text-gray-800 mb-6">Payment Method</h2>

            <div class="flex space-x-4 mb-8">
                <button onclick="selectMethod('card')" id="btn-card" class="payment-card active flex-1 border-2 border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-gray-50 focus:outline-none">
                    <i class="fas fa-credit-card text-2xl text-blue-600"></i>
                    <span class="font-medium text-gray-700">Card</span>
                </button>
                <button onclick="selectMethod('upi')" id="btn-upi" class="payment-card flex-1 border-2 border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-gray-50 focus:outline-none">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI" class="h-6">
                    <span class="font-medium text-gray-700">UPI</span>
                </button>
            </div>

            <!-- Card Form -->
            <form id="payment-form" class="space-y-5">
                <div id="card-inputs" class="space-y-5 block">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
                        <div class="relative">
                            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono">
                            <i class="far fa-credit-card absolute left-3 top-3.5 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
                            <input type="text" placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                            <input type="password" placeholder="123" maxlength="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cardholder Name</label>
                        <input type="text" placeholder="John Doe" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- UPI Input -->
                <div id="upi-inputs" class="hidden space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">UPI ID</label>
                        <div class="relative">
                            <input type="text" placeholder="username@upi" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            <i class="fas fa-mobile-alt absolute left-3 top-3.5 text-gray-400"></i>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">A payment request will be sent to your UPI app.</p>
                    </div>
                </div>

                <button type="submit" id="pay-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center mt-8">
                    <span id="pay-btn-text">Pay ₹499</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentMethod = 'card';
        let bookingData = null;

        // On load, fetch data from sessionStorage
        document.addEventListener('DOMContentLoaded', () => {
            const storedBooking = sessionStorage.getItem('pendingBooking');
            if (!storedBooking) {
                alert('No pending booking found. Redirecting to home.');
                window.location.href = 'index.html';
                return;
            }

            bookingData = JSON.parse(storedBooking);
            
            // Populate summary
            document.getElementById('summary-service').textContent = bookingData.service;
            document.getElementById('summary-name').textContent = bookingData.name;
            document.getElementById('summary-date').textContent = new Date(bookingData.date).toLocaleDateString() || 'Not specified';
        });

        function selectMethod(method) {
            currentMethod = method;
            
            // Update Buttons UI
            document.getElementById('btn-card').classList.remove('active', 'border-blue-500', 'bg-blue-50');
            document.getElementById('btn-upi').classList.remove('active', 'border-blue-500', 'bg-blue-50');
            
            document.getElementById(`btn-${method}`).classList.add('active');

            // Show/Hide inputs
            if (method === 'card') {
                document.getElementById('card-inputs').classList.remove('hidden');
                document.getElementById('upi-inputs').classList.add('hidden');
            } else {
                document.getElementById('card-inputs').classList.add('hidden');
                document.getElementById('upi-inputs').classList.remove('hidden');
            }
        }

        let baseAmount = 499;
        let finalAmount = 499;

        function applyPromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            const msgEl = document.getElementById('promo-message');
            
            if (!code) return;

            if (code === 'FAST50') {
                finalAmount = baseAmount - 50;
                msgEl.textContent = "Promo applied! ₹50 off.";
                msgEl.className = "text-xs mt-2 text-green-300 block";
            } else if (code === 'NEW100') {
                finalAmount = baseAmount - 100;
                msgEl.textContent = "Promo applied! ₹100 off.";
                msgEl.className = "text-xs mt-2 text-green-300 block";
            } else {
                finalAmount = baseAmount;
                msgEl.textContent = "Invalid promo code.";
                msgEl.className = "text-xs mt-2 text-red-300 block";
            }

            document.getElementById('total-amount-display').textContent = `₹${finalAmount}`;
            document.getElementById('pay-btn-text').textContent = `Pay ₹${finalAmount}`;
            
            if(bookingData) {
                bookingData.price = finalAmount; // Update booking data price
            }
        }

        document.getElementById('payment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show processing overlay
            document.getElementById('processing-overlay').classList.remove('hidden');
            document.getElementById('processing-overlay').classList.add('flex');

            // Simulate Network Delay for payment gateway
            setTimeout(async () => {
                try {
                    // Actual API Call to confirm booking
                    const response = await fetch('http://localhost:5000/api/bookings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bookingData)
                    });
                    
                    if (response.ok) {
                        // Clear pending booking
                        sessionStorage.removeItem('pendingBooking');
                        
                        alert('Payment Successful! Your service is booked.');
                        // Redirect to user dashboard
                        window.location.href = 'user-dashboard.html';
                    } else {
                        throw new Error('Failed to book service in DB');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Payment succeeded but booking failed. Please contact support.');
                    document.getElementById('processing-overlay').classList.add('hidden');
                    document.getElementById('processing-overlay').classList.remove('flex');
                }
            }, 2500); // 2.5s dummy delay
        });
    </script>
</body>
</html>
